# Deploy the production Fluxy landing to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production landing
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'G-23Y5TBLYTM' index.html
          grep -q 'AW-17725808040' index.html
          grep -q 'Probalo gratis 30 días' index.html
          grep -q 'linkedin.com/company/fluxy-latam' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
